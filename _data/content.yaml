problem:
  headline: Quarterre holds {phrase} in a single conversation. Most studios divide
    that work. We never have.
  headline_phrase: product, place and play
  pain_items:
    - label: Product. Space.
      body: You have a product people love but the moment they encounter it in a room,
        something doesn't connect. The object is right. The space around it
        feels like it belongs to someone else.
    - label: Brand. Story.
      body: The brand has real history. But somewhere along the way the design stopped
        keeping pace. It still looks like the past. It just doesn't feel like
        the future.
    - label: Culture. Place.
      body: Everyone here believes in what you do but walk through the door and
        nothing tells that story. The work is extraordinary. The place that
        holds it is ordinary.
  closing: Different categories. Different scales. {phrase}
  closing_phrase: The same quality of thought.
pillars:
  heading: Here is what that looks like.
  subtitle: Product, place and play. Not every practice thinks this way.
  items:
    - number: "01"
      title: Product
      body: Objects with purpose. Designed for the moment they are picked up, and
        every moment after.
      image: images/pillar-product.jpg
    - number: "02"
      title: Place
      body: Spaces that do not simply exist. They perform. Every decision a considered
